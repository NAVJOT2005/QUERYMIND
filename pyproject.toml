[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "querymind-cli"
version = "0.1.0"
description = "Workspace-aware natural-language-to-SQL for your terminal. Reads your real schema, verifies queries safely, and works with free LLM APIs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["sql", "text-to-sql", "mysql", "cli", "llm"]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "prompt_toolkit>=3",
    "pymysql>=1.1",
    "cryptography>=42",
    "sqlglot>=25",
    "openai>=1.30",
    "python-dotenv>=1.0",
    "tomli-w>=1.0",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
querymind = "querymind.cli:app"
qm = "querymind.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a live MySQL/MariaDB (set QUERYMIND_TEST_DB_URL)"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501", "B904", "E731", "E702"]  # B008: typer.Option in defaults is the Typer idiom
